<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>HuobaoDrama</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f7fb; color: #262b36; font: 16px/1.7 system-ui, sans-serif; }
  main { max-width: 34rem; padding: 32px; text-align: center; }
  h1 { font-size: 24px; margin: 0 0 12px; }
  p { color: #596274; margin: 6px 0; }
  .spinner { width: 28px; height: 28px; margin: 0 auto 24px; border: 3px solid #e2e5ec; border-top-color: #e88329; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
</style>
<main role="status">
  <div class="spinner" aria-hidden="true"></div>
  <h1>Starting HuobaoDrama</h1>
  <p>Preparing local services. The first launch may take a while.</p>
  <p>No need to click the icon again. If startup fails, you will see the reason and the log location.</p>
</main>
</html>
